
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Business KPI Dashboard</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background: #f7f5fa;
    color: #1e1230;
}

h1 {
    font-size: 38px;
}

.dashboard {
    max-width: 1400px;
    margin: auto;
}

.filters {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

select {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    min-width: 200px;
}

.kpis {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h3 {
    margin: 0;
    font-size: 15px;
}

.card h2 {
    font-size: 28px;
}

.charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.chart {
    background: white;
    border-radius: 15px;
    padding: 10px;
}

@media(max-width:900px) {
    .kpis {
        grid-template-columns: 1fr 1fr;
    }

    .charts {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<div class="dashboard">

<h1>Business KPI Dashboard</h1>

<p>
Customer churn, retention, revenue risk and customer segment analysis
</p>

<div class="filters">

<select id="contract">
<option value="All">All Contracts</option>
<option value="Month-to-Month">Month-to-Month</option>
<option value="One Year">One Year</option>
<option value="Two Year">Two Year</option>
</select>

<select id="tenure">
<option value="All">All Tenure Groups</option>
<option value="0–6 Months">0–6 Months</option>
<option value="7–12 Months">7–12 Months</option>
<option value="13–24 Months">13–24 Months</option>
<option value="25+ Months">25+ Months</option>
</select>

<select id="payment">
<option value="All">All Payment Methods</option>
<option value="Credit Card">Credit Card</option>
<option value="UPI">UPI</option>
<option value="Bank Transfer">Bank Transfer</option>
<option value="Debit Card">Debit Card</option>
</select>

</div>

<div class="kpis">

<div class="card">
<h3>Total Customers</h3>
<h2 id="totalCustomers">-</h2>
</div>

<div class="card">
<h3>Churn Rate</h3>
<h2 id="churnRate">-</h2>
</div>

<div class="card">
<h3>Retention Rate</h3>
<h2 id="retentionRate">-</h2>
</div>

<div class="card">
<h3>Monthly Revenue at Risk</h3>
<h2 id="revenueRisk">-</h2>
</div>

<div class="card">
<h3>Average Tenure</h3>
<h2 id="avgTenure">-</h2>
</div>

</div>

<div class="charts">

<div class="chart">
<div id="contractChart"></div>
</div>

<div class="chart">
<div id="tenureChart"></div>
</div>

<div class="chart">
<div id="paymentChart"></div>
</div>

<div class="chart">
<div id="riskChart"></div>
</div>

</div>

</div>

<script>

const originalData = [{"CustomerID": "CUST-1001", "Gender": "Female", "Age": 34, "TenureMonths": 12, "SubscriptionType": "Basic", "MonthlyCharges": 49.99, "TotalCharges": 599.88, "ContractType": "Month-to-Month", "SupportTickets": 3, "PaymentMethod": "Credit Card", "Churn": "Yes", "TenureGroup": "7\u201312 Months", "RiskSegment": "High Risk"}, {"CustomerID": "CUST-1002", "Gender": "Male", "Age": 45, "TenureMonths": 24, "SubscriptionType": "Pro", "MonthlyCharges": 79.99, "TotalCharges": 1919.76, "ContractType": "One Year", "SupportTickets": 1, "PaymentMethod": "Bank Transfer", "Churn": "No", "TenureGroup": "13\u201324 Months", "RiskSegment": "Lower Risk"}, {"CustomerID": "CUST-1003", "Gender": "Female", "Age": 29, "TenureMonths": 6, "SubscriptionType": "Basic", "MonthlyCharges": 49.99, "TotalCharges": 299.94, "ContractType": "Month-to-Month", "SupportTickets": 5, "PaymentMethod": "UPI", "Churn": "Yes", "TenureGroup": "0\u20136 Months", "RiskSegment": "High Risk"}, {"CustomerID": "CUST-1004", "Gender": "Male", "Age": 52, "TenureMonths": 36, "SubscriptionType": "Enterprise", "MonthlyCharges": 149.99, "TotalCharges": 5399.64, "ContractType": "Two Year", "SupportTickets": 0, "PaymentMethod": "Credit Card", "Churn": "No", "TenureGroup": "25+ Months", "RiskSegment": "Lower Risk"}, {"CustomerID": "CUST-1005", "Gender": "Female", "Age": 41, "TenureMonths": 8, "SubscriptionType": "Pro", "MonthlyCharges": 79.99, "TotalCharges": 639.92, "ContractType": "Month-to-Month", "SupportTickets": 4, "PaymentMethod": "Debit Card", "Churn": "Yes", "TenureGroup": "7\u201312 Months", "RiskSegment": "High Risk"}, {"CustomerID": "CUST-1006", "Gender": "Male", "Age": 31, "TenureMonths": 18, "SubscriptionType": "Basic", "MonthlyCharges": 49.99, "TotalCharges": 899.82, "ContractType": "One Year", "SupportTickets": 2, "PaymentMethod": "UPI", "Churn": "No", "TenureGroup": "13\u201324 Months", "RiskSegment": "Lower Risk"}, {"CustomerID": "CUST-1007", "Gender": "Female", "Age": 23, "TenureMonths": 3, "SubscriptionType": "Basic", "MonthlyCharges": 49.99, "TotalCharges": 149.97, "ContractType": "Month-to-Month", "SupportTickets": 6, "PaymentMethod": "Credit Card", "Churn": "Yes", "TenureGroup": "0\u20136 Months", "RiskSegment": "High Risk"}, {"CustomerID": "CUST-1008", "Gender": "Male", "Age": 60, "TenureMonths": 48, "SubscriptionType": "Enterprise", "MonthlyCharges": 149.99, "TotalCharges": 7199.52, "ContractType": "Two Year", "SupportTickets": 1, "PaymentMethod": "Bank Transfer", "Churn": "No", "TenureGroup": "25+ Months", "RiskSegment": "Lower Risk"}, {"CustomerID": "CUST-1009", "Gender": "Female", "Age": 38, "TenureMonths": 15, "SubscriptionType": "Pro", "MonthlyCharges": 79.99, "TotalCharges": 1199.85, "ContractType": "One Year", "SupportTickets": 2, "PaymentMethod": "Credit Card", "Churn": "No", "TenureGroup": "13\u201324 Months", "RiskSegment": "Lower Risk"}, {"CustomerID": "CUST-1010", "Gender": "Male", "Age": 27, "TenureMonths": 4, "SubscriptionType": "Basic", "MonthlyCharges": 49.99, "TotalCharges": 199.96, "ContractType": "Month-to-Month", "SupportTickets": 4, "PaymentMethod": "UPI", "Churn": "Yes", "TenureGroup": "0\u20136 Months", "RiskSegment": "High Risk"}, {"CustomerID": "CUST-1011", "Gender": "Female", "Age": 49, "TenureMonths": 30, "SubscriptionType": "Enterprise", "MonthlyCharges": 149.99, "TotalCharges": 4499.7, "ContractType": "Two Year", "SupportTickets": 0, "PaymentMethod": "Credit Card", "Churn": "No", "TenureGroup": "25+ Months", "RiskSegment": "Lower Risk"}, {"CustomerID": "CUST-1012", "Gender": "Male", "Age": 33, "TenureMonths": 14, "SubscriptionType": "Pro", "MonthlyCharges": 79.99, "TotalCharges": 1119.86, "ContractType": "Month-to-Month", "SupportTickets": 3, "PaymentMethod": "Debit Card", "Churn": "Yes", "TenureGroup": "13\u201324 Months", "RiskSegment": "Medium Risk"}, {"CustomerID": "CUST-1013", "Gender": "Female", "Age": 55, "TenureMonths": 22, "SubscriptionType": "Basic", "MonthlyCharges": 49.99, "TotalCharges": 1099.78, "ContractType": "One Year", "SupportTickets": 1, "PaymentMethod": "Bank Transfer", "Churn": "No", "TenureGroup": "13\u201324 Months", "RiskSegment": "Lower Risk"}, {"CustomerID": "CUST-1014", "Gender": "Male", "Age": 26, "TenureMonths": 2, "SubscriptionType": "Basic", "MonthlyCharges": 49.99, "TotalCharges": 99.98, "ContractType": "Month-to-Month", "SupportTickets": 5, "PaymentMethod": "UPI", "Churn": "Yes", "TenureGroup": "0\u20136 Months", "RiskSegment": "High Risk"}, {"CustomerID": "CUST-1015", "Gender": "Female", "Age": 43, "TenureMonths": 40, "SubscriptionType": "Enterprise", "MonthlyCharges": 149.99, "TotalCharges": 5999.6, "ContractType": "Two Year", "SupportTickets": 1, "PaymentMethod": "Credit Card", "Churn": "No", "TenureGroup": "25+ Months", "RiskSegment": "Lower Risk"}];

function getTenureGroup(months) {
    if (months <= 6) return "0–6 Months";
    if (months <= 12) return "7–12 Months";
    if (months <= 24) return "13–24 Months";
    return "25+ Months";
}

function updateDashboard() {

    const contract = document.getElementById("contract").value;
    const tenure = document.getElementById("tenure").value;
    const payment = document.getElementById("payment").value;

    let data = originalData.filter(row => {

        const contractMatch =
            contract === "All" || row.ContractType === contract;

        const tenureMatch =
            tenure === "All" || getTenureGroup(row.TenureMonths) === tenure;

        const paymentMatch =
            payment === "All" || row.PaymentMethod === payment;

        return contractMatch && tenureMatch && paymentMatch;
    });

    const total = data.length;

    const churned = data.filter(
        row => row.Churn === "Yes"
    ).length;

    const churnRate = total > 0
        ? churned / total * 100
        : 0;

    const retentionRate = 100 - churnRate;

    const revenueRisk = data
        .filter(row => row.Churn === "Yes")
        .reduce(
            (sum, row) => sum + Number(row.MonthlyCharges),
            0
        );

    const avgTenure = total > 0
        ? data.reduce(
            (sum, row) => sum + Number(row.TenureMonths),
            0
        ) / total
        : 0;

    document.getElementById("totalCustomers").innerText =
        total;

    document.getElementById("churnRate").innerText =
        churnRate.toFixed(1) + "%";

    document.getElementById("retentionRate").innerText =
        retentionRate.toFixed(1) + "%";

    document.getElementById("revenueRisk").innerText =
        "₹" + revenueRisk.toFixed(2);

    document.getElementById("avgTenure").innerText =
        avgTenure.toFixed(1) + " mo";

    // Contract chart
    const contracts = [...new Set(
        data.map(row => row.ContractType)
    )];

    const contractRates = contracts.map(c => {

        const group = data.filter(
            row => row.ContractType === c
        );

        return group.length > 0
            ? group.filter(row => row.Churn === "Yes").length
              / group.length * 100
            : 0;
    });

    Plotly.newPlot(
        "contractChart",
        [{
            x: contracts,
            y: contractRates,
            type: "bar",
            text: contractRates.map(x => x.toFixed(1) + "%"),
            textposition: "auto"
        }],
        {
            title: "Churn Rate by Contract Type",
            yaxis: {title: "Churn Rate (%)"},
            template: "plotly_white"
        }
    );

    // Tenure chart
    const tenureGroups = [
        "0–6 Months",
        "7–12 Months",
        "13–24 Months",
        "25+ Months"
    ];

    const tenureRates = tenureGroups.map(t => {

        const group = data.filter(
            row => getTenureGroup(row.TenureMonths) === t
        );

        return group.length > 0
            ? group.filter(row => row.Churn === "Yes").length
              / group.length * 100
            : 0;
    });

    Plotly.newPlot(
        "tenureChart",
        [{
            x: tenureGroups,
            y: tenureRates,
            type: "bar",
            text: tenureRates.map(x => x.toFixed(1) + "%"),
            textposition: "auto"
        }],
        {
            title: "Churn Rate by Tenure",
            yaxis: {title: "Churn Rate (%)"},
            template: "plotly_white"
        }
    );

    // Payment chart
    const payments = [...new Set(
        data.map(row => row.PaymentMethod)
    )];

    const paymentRates = payments.map(p => {

        const group = data.filter(
            row => row.PaymentMethod === p
        );

        return group.length > 0
            ? group.filter(row => row.Churn === "Yes").length
              / group.length * 100
            : 0;
    });

    Plotly.newPlot(
        "paymentChart",
        [{
            x: payments,
            y: paymentRates,
            type: "bar",
            text: paymentRates.map(x => x.toFixed(1) + "%"),
            textposition: "auto"
        }],
        {
            title: "Churn Rate by Payment Method",
            yaxis: {title: "Churn Rate (%)"},
            template: "plotly_white"
        }
    );

    // Risk chart
    const riskGroups = ["High Risk", "Medium Risk", "Lower Risk"];

    function getRisk(row) {

        let score = 0;

        if (row.TenureMonths <= 12)
            score++;

        if (row.ContractType === "Month-to-Month")
            score++;

        if (row.SupportTickets >= 3)
            score++;

        if (score >= 3)
            return "High Risk";

        if (score === 2)
            return "Medium Risk";

        return "Lower Risk";
    }

    const riskRates = riskGroups.map(r => {

        const group = data.filter(
            row => getRisk(row) === r
        );

        return group.length > 0
            ? group.filter(row => row.Churn === "Yes").length
              / group.length * 100
            : 0;
    });

    Plotly.newPlot(
        "riskChart",
        [{
            x: riskGroups,
            y: riskRates,
            type: "bar",
            text: riskRates.map(x => x.toFixed(1) + "%"),
            textposition: "auto"
        }],
        {
            title: "Churn Rate by Risk Segment",
            yaxis: {title: "Churn Rate (%)"},
            template: "plotly_white"
        }
    );
}

document.getElementById("contract")
    .addEventListener("change", updateDashboard);

document.getElementById("tenure")
    .addEventListener("change", updateDashboard);

document.getElementById("payment")
    .addEventListener("change", updateDashboard);

updateDashboard();

</script>

</body>
</html>
